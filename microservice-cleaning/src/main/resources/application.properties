# Micronaut Application
micronaut.server.port=8081
micronaut.application.name=microservice-cleaning
micronaut.server.context-path=${BASE_PATH:/}

# CORS
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.ui.allowed-origins[0]="*"
micronaut.server.cors.configurations.ui.allowed-methods[0]=GET
micronaut.server.cors.configurations.ui.allowed-methods[1]=PUT
micronaut.server.cors.configurations.ui.allowed-methods[2]=POST
micronaut.server.cors.configurations.ui.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.ui.allowed-methods[4]=OPTIONS

# Kafka
kafka.bootstrap.servers=${KAFKA_DEFAULT_URL}

# SASL Configuration
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=PLAIN
kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
    username="${KAFKA_USER}" \
    password="${KAFKA_PASSWORD}";

# Retries and Backoff
kafka.reconnect.backoff.ms=30000
kafka.retry.backoff.ms=32000

# Enable Kafka tracing with OpenTelemetry
kafka.enabled=true
kafka.consumers.default.enable-auto-commit=true
kafka.consumers.default.auto-offset-reset=earliest

# Ensure Kafka consumer uses OpenTelemetry context propagation
kafka.consumers.default.properties.propagate-otel-context=true

# Hibernate
jpa.default.properties.hibernate.hbm2ddl.auto=none

# Liquibase
liquibase.datasources.default.change-log=classpath\:db/main.xml

# PostgreSQL
datasources.default.url=${DATASOURCES_DEFAULT_URL}
datasources.default.username=${DATASOURCES_DEFAULT_USERNAME}
datasources.default.password=${DATASOURCES_DEFAULT_PASSWORD}
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver

# Reservation microservice
service.reservation.url=${RESERVATIONS_SERVICE_URL}

# Billing microservice
service.billing.url=${BILLING_SERVICE_URL}

# Otel whooo
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none

# Configure endpoint for Traces
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}
otel.exporter.otlp.protocol=grpc
otel.service.name=${micronaut.application.name}

# Enable tracing with proper propagation
tracing.enabled=true
tracing.exclusions[0]=/health/live
tracing.exclusions[1]=/health/ready
tracing.exclusions[2]=/metrics.*
tracing.exclusions[3]=/health/?.*
tracing.exclusions[4]=/api/cleaning/health/.*
tracing.exclusions[5]=/api/cleaning/health/*
tracing.exclusions[6]=/api/**/health/**
tracing.exclusions[7]=GET:/api/cleaning/health/*
tracing.exclusions[8]=health


otel.propagators=tracecontext,baggage
otel.instrumentation.kafka.enabled=false
otel.instrumentation.jdbc.enabled=true

# Disable database health check to prevent DB connection traces
endpoints.health.db.enabled=false

# Additional OpenTelemetry suppressions for health endpoints
otel.trace.service.name.ignore.operation-name=true
