apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice-cleaning.fullname" . }}
  labels:
    app: {{ include "microservice-cleaning.name" . }}
    chart: {{ include "microservice-cleaning.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "microservice-cleaning.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "microservice-cleaning.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.basePath | default "" }}/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.basePath | default "" }}/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: BILLING_SERVICE_URL
              value: "http://{{ .Values.billing.service.name }}.{{ .Values.billing.service.namespace }}.svc.cluster.local/api/billing"
            - name: RESERVATIONS_SERVICE_URL
              value: "http://{{ .Values.reservations.service.name }}.{{ .Values.reservations.service.namespace }}.svc.cluster.local/api/reservations"
            - name: DATASOURCES_DEFAULT_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: DATASOURCES_DEFAULT_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: DATASOURCES_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name }}
                  key: {{ .Values.database.passwordSecret.key }}
            - name: KAFKA_DEFAULT_URL
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.passwordSecret.name }}
                  key: {{ .Values.kafka.passwordSecret.key }}
            - name: KAFKA_USER
              value: {{ .Values.kafka.kafkaUser }}
            - name: BASE_PATH
              value: {{ .Values.basePath | default "/" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: {{ .Values.opentelemetry.metricsEndpoint | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Dotel.java.global-autoconfigure.enabled=true"
{{- include "microservice-cleaning.envVars" . }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
