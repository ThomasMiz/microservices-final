quarkus.application.name=microservice-kitchen
quarkus.application.version=1.0.0

# =============================================
# Redis Configuration
# =============================================
%prod.quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
%prod.quarkus.redis.password=${REDIS_PASSWORD}

# Redis Streams Configuration
%prod.redis.streams.kitchen-requests=${KITCHEN_REQUESTS_STREAM:kitchen-requests}
%prod.redis.streams.kitchen-responses=${KITCHEN_RESPONSES_STREAM:kitchen-responses}
%prod.redis.streams.consumer-group=${KITCHEN_CONSUMER_GROUP:kitchen-group}

# =============================================
# HTTP Configuration
# =============================================
%prod.quarkus.http.root-path=/api/kitchen

# =============================================
# OpenTelemetry Configuration
# =============================================
%prod.quarkus.otel.enabled=true
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://observability-opentelemetry-collector.shared-infrastructure.svc.cluster.local:4317}

# Disable tracing for health check endpoints
%prod.quarkus.otel.tracer.suppress-extracting-span-name-for-path-patterns=/q/health/*,/health/*
%prod.quarkus.otel.tracer.exclude-path-patterns=/q/health/*,/health/*

# Disable automatic Redis instrumentation
%prod.quarkus.otel.instrument.redis=false

# METRICS: Send every 15s
%prod.quarkus.micrometer.enabled=true
%prod.quarkus.micrometer.export.otlp.enabled=true
%prod.quarkus.micrometer.export.otlp.step=15s

# Disable OTLP Logging (logs stay on disk)
%prod.quarkus.otel.logs.enabled=false

# =============================================
# Logging Configuration
# =============================================
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.fields.mdc.enabled=true
%prod.quarkus.log.console.json.fields.trace-id.enabled=true
%prod.quarkus.log.console.json.fields.trace-id.field-name=trace_id
%prod.quarkus.log.console.json.fields.span-id.enabled=true
%prod.quarkus.log.console.json.fields.span-id.field-name=span_id
%prod.quarkus.log.console.json.fields.timestamp.enabled=true
