replicaCount: 1

image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2025-s2/grupo-e/microservice-kitchen
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi



nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /api/kitchen
          pathType: Prefix
  tls: []


redis:
  host: chotel-default-redis-master.shared-infrastructure.svc.cluster.local
  port: 6379
  passwordSecret:
    name: "chotel-secrets"
    key: "redis-password"
  streams:
    requests: "kitchen-requests"  # Requests from Room Service
    responses: "kitchen-responses"  # Responses to Room Service
  consumerGroup: "kitchen-group"

opentelemetry:
  endpoint: "http://observability-opentelemetry-collector.shared-infrastructure.svc.cluster.local:4317"

env: []

