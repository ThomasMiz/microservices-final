# Micronaut Application
micronaut.application.name=microservice-reservations

# Hibernate
jpa.default.properties.hibernate.hbm2ddl.auto=none

# Liquibase
liquibase.datasources.default.change-log=classpath\:db/main.xml

# PostgreSQL
datasources.default.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
datasources.default.url=jdbc:tc:postgresql:18-alpine:///db
datasources.default.username=test
datasources.default.password=test
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES

otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none
micronaut.metrics.export.otlp.enabled=false
micronaut.metrics.enabled=false

# Override these so they are not inferred from the main application.properties
otel.exporter.otlp.endpoint=none
micronaut.metrics.export.otlp.url=none
