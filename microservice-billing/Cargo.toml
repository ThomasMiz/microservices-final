[package]
name = "microservice-billing"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
bigdecimal = { version = "0.4.9", features = ["serde-json"] }
chrono = { version = "0.4.42", features = ["std", "clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "bigdecimal"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v7", "serde"] }
rand = "0.9.2"
axum-tracing-opentelemetry = "0.32.2"
init-tracing-opentelemetry = { version = "0.34.0", features = ["tracing_subscriber_ext", "metrics"] }
sqlx_migrator = { version = "0.18.0", features = ["postgres"] }
