apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice-billing.fullname" . }}
  labels:
    {{- include "microservice-billing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "microservice-billing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservice-billing.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name }}
                  key: {{ .Values.database.passwordSecret.key }}
            - name: DATABASE_URL
              value: postgresql://{{ .Values.database.user }}:$(DATABASE_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | default "INFO" }}
            - name: LISTEN_AT
              value: {{ .Values.listenAt | default "0.0.0.0:5000" }}
            - name: BASE_PATH
              value: {{ .Values.basePath | default "/" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_SERVICE_NAME
              value: microservice-billing
            - name: PAYMENT_FAIL_CHANCE
              value: {{ .Values.failChance | default "0.05" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
