# CHotel E2E Tests Pipeline
#
# This pipeline runs end-to-end integration tests for the CHotel microservices.
# It is triggered by downstream pipelines from individual microservice repositories.
#
# Pipeline Flow:
# 1. Install dependencies
# 2. Wait for services to be healthy
# 3. Run E2E tests
# 4. Cleanup test data

image: oven/bun:latest

variables:
  # Test environment configuration
  STAGING_BASE_URL: "https://chotel-staging.cuini.me"
  # Timeouts
  TEST_TIMEOUT_DEFAULT: "15000"

stages:
  - install
  - test

# Cache bun dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .bun/

# =============================================================================
# Install Stage
# =============================================================================

install:
  stage: install
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# =============================================================================
# Test Stage
# =============================================================================

e2e-tests:
  stage: test
  script:
    - echo "Running E2E tests..."
    - echo "Service changed - $SERVICE_CHANGED"
    - echo "Service version - $SERVICE_VERSION"
    - bun test
  artifacts:
    when: always
  timeout: 20 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH == "main"'

