[tool:pytest]
# Directorios donde buscar tests
testpaths = test

# Patrones de archivos de test
python_files = test_*.py *_test.py

# Patrones de clases de test
python_classes = Test*

# Patrones de funciones de test
python_functions = test_*

# Configuración para tests asíncronos
asyncio_mode = auto

# Opciones adicionales por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings

# Marcadores personalizados
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    external: Tests that require external services

# Configuración de filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout para tests (en segundos)
timeout = 300

# Directorio mínimo para pytest
minversion = 7.0